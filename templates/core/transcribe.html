<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Auditext</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Barra superior -->
    <header class="bg-white shadow p-4 flex justify-center items-center">
        <h1 class="text-2xl font-bold">Auditext</h1>
    </header>

    <!-- Contenido principal -->
    <main class="flex flex-1 p-4 gap-4">
        <!-- Lista de archivos -->
        <section class="bg-white rounded shadow flex-1 flex flex-col p-4">
            <h2 class="text-lg font-semibold mb-2">Lista de archivos</h2>
            <ul id="file-list" class="flex-1 border rounded mb-4 overflow-y-auto p-2 text-sm text-gray-700"></ul>
            <input id="file-input" type="file" class="hidden" multiple accept="audio/*">
            <div class="flex gap-2">
                <button id="select-files" class="bg-blue-500 text-white px-3 py-1 rounded">Seleccionar Archivos</button>
                <button id="delete-file" class="bg-gray-300 px-3 py-1 rounded" disabled>Borrar</button>
                <button id="transcribe-btn" class="bg-green-500 text-white px-3 py-1 rounded" disabled>Transcribir</button>
            </div>
        </section>
        <!-- Transcripción -->
        <section class="bg-white rounded shadow flex-[2] flex flex-col p-4">
            <h2 class="text-lg font-semibold mb-2">Transcripción</h2>
            <textarea id="transcription-area" class="flex-1 border rounded p-2 mb-4" placeholder="Aquí aparecerá la transcripción..." readonly></textarea>
            <div class="flex gap-2 justify-end">
                <button id="clear-btn" class="bg-yellow-400 px-3 py-1 rounded">Limpiar</button>
                <button id="export-btn" class="bg-blue-700 text-white px-3 py-1 rounded">Exportar</button>
            </div>
            <div id="progress-bar-container" class="w-full h-3 bg-gray-200 rounded mt-4 hidden">
                <div id="progress-bar" class="h-3 bg-blue-500 rounded w-1/3 animate-pulse"></div>
            </div>
            <div id="transcribe-status" class="text-sm text-gray-500 mt-2"></div>
        </section>
    </main>

    <!-- Controles inferiores -->
    <footer class="bg-white shadow p-4 flex flex-col items-center">
        <div class="flex items-center gap-4 mb-2">
            <label>Modelo de Transcriptor:</label>
            <select class="border rounded px-2 py-1">
                <option>medium</option>
                <option>small</option>
                <option>large</option>
            </select>
            <label class="ml-4">Idioma Entrada:</label>
            <select class="border rounded px-2 py-1">
                <option>Spanish</option>
                <option>English</option>
            </select>
            <label class="ml-4">Idioma Salida:</label>
            <select class="border rounded px-2 py-1">
                <option>Spanish</option>
                <option>English</option>
            </select>
        </div>
        <div class="flex items-center gap-2 mb-2">
            <button class="bg-gray-200 p-2 rounded-full">&#9654;</button>
            <button class="bg-gray-200 p-2 rounded-full">&#9724;</button>
            <span>00:00 / 00:00</span>
        </div>
        <div class="text-xs text-gray-500 mt-2">
            &copy;Copyright 2024 Version 1.1 Produced by Correa Jonathan
        </div>
    </footer>
    <script>
    // Manejo de selección de archivos y lista
    const fileInput = document.getElementById('file-input');
    const selectFilesBtn = document.getElementById('select-files');
    const fileList = document.getElementById('file-list');
    const deleteFileBtn = document.getElementById('delete-file');
    const transcribeBtn = document.getElementById('transcribe-btn');
    const clearBtn = document.getElementById('clear-btn');
    const exportBtn = document.getElementById('export-btn');
    const transcriptionArea = document.getElementById('transcription-area');
    const transcribeStatus = document.getElementById('transcribe-status');
    const progressBarContainer = document.getElementById('progress-bar-container');
    let files = [];
    let selectedIdx = null;

    selectFilesBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        files = Array.from(e.target.files);
        selectedIdx = null;
        renderFileList();
    });

    function renderFileList() {
        fileList.innerHTML = '';
        files.forEach((file, idx) => {
            const li = document.createElement('li');
            li.textContent = file.name;
            li.className = 'cursor-pointer px-2 py-1 rounded hover:bg-blue-100' + (selectedIdx === idx ? ' bg-blue-200' : '');
            li.onclick = () => {
                selectedIdx = idx;
                renderFileList();
                deleteFileBtn.disabled = false;
                transcribeBtn.disabled = false;
            };
            fileList.appendChild(li);
        });
        if (selectedIdx === null || files.length === 0) {
            deleteFileBtn.disabled = true;
            transcribeBtn.disabled = true;
        }
    }

    deleteFileBtn.addEventListener('click', () => {
        if (selectedIdx !== null) {
            files.splice(selectedIdx, 1);
            selectedIdx = null;
            renderFileList();
        }
    });

    clearBtn.addEventListener('click', () => {
        transcriptionArea.value = '';
    });

    exportBtn.addEventListener('click', () => {
        const text = transcriptionArea.value;
        if (!text) return;
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'transcripcion.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    // Transcribir archivo seleccionado
    transcribeBtn.addEventListener('click', () => {
        if (selectedIdx !== null && files[selectedIdx]) {
            const formData = new FormData();
            formData.append('audio', files[selectedIdx]);
            transcriptionArea.value = '';
            transcribeStatus.textContent = 'Transcribiendo...';
            progressBarContainer.classList.remove('hidden');
            fetch('/api/transcribe/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                transcriptionArea.value = data.transcription || 'Error en la transcripción';
                transcribeStatus.textContent = '';
                progressBarContainer.classList.add('hidden');
            })
            .catch(() => {
                transcriptionArea.value = 'Error en la transcripción';
                transcribeStatus.textContent = '';
                progressBarContainer.classList.add('hidden');
            });
        }
    });
    </script>
</body>
</html>
